plugins { id 'com.android.application' }

android {
    namespace 'com.tunnellite.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tunnellite.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        warningsAsErrors true
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
